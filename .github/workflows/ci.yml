name: CI

on:
  push:
    branches: [main, "chore/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

# A new push to the same branch cancels whatever CI run is already in
# flight for it — no point finishing a check on a commit you've superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: make lint
      - run: make typecheck
      - run: make test

  python-integration:
    name: Python — integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Start infra (same Compose file as local dev)
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait
      - run: uv run alembic upgrade head
      - run: make test-integration
      - name: Tear down infra
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm format:check
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  contract-drift:
    name: Web — generated API types match the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Regenerate types from a live API and diff against committed file
        run: |
          uv run uvicorn sentinelai.main:app --port 8000 &
          API_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/openapi.json > /dev/null && break
            sleep 1
          done
          cd web
          pnpm gen:api-types
          git diff --exit-code -- src/lib/api-types.gen.ts
          kill "$API_PID"

  docker-build:
    name: Docker — build and smoke-test images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          load: true
          tags: sentinelai-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Smoke-test the API image (liveness only — no DB in this job)
        run: |
          docker run -d --rm --name api-smoke -p 8000:8000 sentinelai-api:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8000/healthz
          docker logs api-smoke
          docker stop api-smoke

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: infra/docker/web.Dockerfile
          push: false
          tags: sentinelai-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
